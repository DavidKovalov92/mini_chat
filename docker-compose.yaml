version: '3.9'

services:
  # ----------- SERVICES -----------
  auth_service:
    build: ./auth_service
    container_name: auth_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:admin@auth_db:5432/auth_db
    depends_on:
      - auth_db
    networks:
      - backend

  user_service:
    build: ./user_service
    container_name: user_service
    command: uvicorn main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:admin@user_db:5432/user_db
    depends_on:
      - user_db
    networks:
      - backend

  chat_service:
    build: ./chat_service
    container_name: chat_service
    command: uvicorn main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:admin@chat_db:5432/chat_db
    depends_on:
      - chat_db
    networks:
      - backend


  # ----------- DATABASES -----------
  auth_db:
    image: postgres:16
    container_name: auth_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth_db
    networks:
      - backend

  user_db:
    image: postgres:16
    container_name: user_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: user_db
    networks:
      - backend

  chat_db:
    image: postgres:16
    container_name: chat_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chat_db
    networks:
      - backend


  # ----------- NGINX GATEWAY -----------
  nginx:
    image: nginx:latest
    container_name: nginx_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - user_service
      - chat_service
    networks:
      - backend

  # ----------- API GATEWAY -----------
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth_service:8001
      USER_SERVICE_URL: http://user_service:8002
      CHAT_SERVICE_URL: http://chat_service:8003
    networks:
      - backend 
    depends_on:
      - auth_service
      - chat_service
      - user_service

networks:
  backend:
