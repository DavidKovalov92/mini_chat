events {
    worker_connections 1024;
}

http {
    # Налаштування для WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # 1. Спеціальний маршрут для WebSockets (напряму в чат-сервіс)
        location ~* ^/chat_service/rooms/(.*)/ws$ {
            # Перенаправляємо на внутрішній порт чат-сервісу
            proxy_pass http://chat_service:8003/rooms/$1/ws;
            
            # Налаштування для підтримки протоколу WS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Тайм-аути для довгих з'єднань (щоб сокет не розривався кожні 60с)
            proxy_read_timeout 86400;
        }

        # 2. Усі інші запити (HTTP) йдуть на твій Python Gateway
        location / {
            proxy_pass http://gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}